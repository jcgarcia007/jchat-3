# JChat 3.0 — Supabase project config
# Links the CLI to the project and sets per-function JWT verification so
# `supabase functions deploy` picks up the right flags automatically.

project_id = "klfsgcfoahdtkojyqspd"

# App-invoked functions: called from the client with a Supabase JWT → verify.
[functions.payments]
verify_jwt = true

[functions.stripe-connect]
verify_jwt = true

# POS Terminal: called from the mobile app with a Supabase JWT. verify_jwt = false
# because we verify the JWT manually inside the handler (same pattern as
# subscriptions) — this gives us fine-grained control and makes the function
# safe to extend with webhook endpoints later.
[functions.terminal]
verify_jwt = false

# Stripe-invoked webhooks: called by Stripe with NO Supabase JWT (they verify
# the Stripe signature instead) → JWT verification must be off.
[functions.stripe-webhook]
verify_jwt = false

[functions.subscriptions]
verify_jwt = false

# Public tab-payment page: the customer paying via QR may have no account, so this
# is called WITHOUT a JWT. Protected by the opaque pay_token + acting only on a
# 'pending' card payment (same model as the webhook). Does NOT lower payments'.
[functions.tab-pay]
verify_jwt = false

# Public guest checkout (G1): a walk-in with no account pays from the menu. Called
# WITHOUT a JWT; the bot defence is server-side hCaptcha (not anonymous sessions —
# see D-39). Does NOT lower payments'.
[functions.guest-pay]
verify_jwt = false

# Public guest-tab session EF: called from the menu with no Supabase JWT.
# Handles create_session / session_status / add_order for Tab POS F3.
[functions.guest-tab]
verify_jwt = false

# Database webhook: invoked by pg_net with x-push-secret, not a user JWT.
[functions.send-push]
verify_jwt = false

# Gift worker: invoked by pg_net (migration 202) with x-push-secret, not a user JWT. Captures/cancels the held PaymentIntent.
[functions.gift-worker]
verify_jwt = false

# Match photo moderation: invoked by pg_net (migration 193) with x-push-secret, not a user JWT.
[functions.moderate-match-photo]
verify_jwt = false

# Urgent-report email: invoked by pg_net (migration 212) with x-push-secret, not a user JWT. Emails safety@jchat.cloud (notice only).
[functions.safety-alert]
verify_jwt = false

# ── Auth email templates (bilingual ES/EN) ─────────────────────────────────
# Source of truth: supabase/templates/*.html (see docs/JCHAT_PLANTILLAS_CORREO_SUPABASE.md).
# Applies to local dev only; in production they are pasted manually into
# Dashboard → Authentication → Emails → Templates from these same files.
# The "📱 open on your phone" notice is conditional on {{ .RedirectTo }}, so
# it only shows when the link opens the app (jchat://…), never for web flows.
[auth.email.template.recovery]
subject = "JChat — Tu código para restablecer la contraseña · Your password reset code"
content_path = "./supabase/templates/recovery.html"

[auth.email.template.confirmation]
subject = "JChat — Confirma tu correo · Confirm your email"
content_path = "./supabase/templates/confirmation.html"

[auth.email.template.email_change]
subject = "JChat — Confirma tu nuevo correo · Confirm your new email"
content_path = "./supabase/templates/email_change.html"

[auth.email.template.magic_link]
subject = "JChat — Tu enlace para entrar · Your sign-in link"
content_path = "./supabase/templates/magic_link.html"

[auth.email.template.invite]
subject = "Te invitaron a JChat · You've been invited to JChat"
content_path = "./supabase/templates/invite.html"

[auth.email.template.reauthentication]
subject = "JChat — Tu código de verificación · Your verification code"
content_path = "./supabase/templates/reauthentication.html"
