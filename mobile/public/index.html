<!DOCTYPE html>
<html lang="%LANG_ISO_CODE%">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
    <!-- Browser UI colour (iOS status bar / Android address bar). The first paint follows the OS scheme; the app then
         keeps it in sync with its own theme and, in the chat, with the top bar (utils/webThemeColor.web.ts). -->
    <meta name="theme-color" content="#F9F9FB" />
    <script>
      (function () {
        try {
          var m = document.querySelector('meta[name="theme-color"]');
          if (m && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) m.setAttribute('content', '#0A0F1E');
        } catch (e) {}
      })();
    </script>
    <!-- Safari's native Smart App Banner. activar en el lanzamiento junto con INVITE_TO_APP_ENABLED (constants/appLinks.ts):
         this file is static and cannot read that switch, so it stays commented until the app is public in both stores.
    <meta name="apple-itunes-app" content="app-id=6824292679" />
    -->
    <link rel="manifest" href="/manifest.json" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <title>%WEB_TITLE%</title>
    <!-- The `react-native-web` recommended style reset: https://necolas.github.io/react-native-web/docs/setup/#root-element -->
    <style id="expo-reset">
      /* The document never scrolls: only the lists inside the app do. On iOS Safari the keyboard scrolls the
         *visual* viewport (and zooms inputs under 16 px); a fixed, visual-viewport-sized body keeps the chat header on
         screen and the input right above the keyboard (see the script below). 100dvh is the fallback without JS. */
      html {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        overscroll-behavior: none;
        -webkit-text-size-adjust: 100%;
      }
      body {
        position: fixed;
        left: 0;
        right: 0;
        top: var(--app-top, 0px);
        width: 100%;
        height: 100%;
        height: var(--app-h, 100dvh);
        margin: 0;
        overflow: hidden;
        overscroll-behavior: none;
      }
      /* These styles make the root element full-height */
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
    </style>
    <script>
      /* Keeps <body> exactly on the visible area. Skipped while the user pinch-zooms (scale > 1) so zooming stays
         usable; the document is pulled back to (0,0) whenever iOS scrolls it to reveal a focused field. */
      (function () {
        var vv = window.visualViewport;
        var root = document.documentElement;
        function fit() {
          if (vv && vv.scale <= 1.01) {
            root.style.setProperty('--app-h', Math.round(vv.height) + 'px');
            root.style.setProperty('--app-top', Math.round(vv.offsetTop) + 'px');
          } else {
            root.style.removeProperty('--app-h');
            root.style.removeProperty('--app-top');
          }
          if (window.scrollX || window.scrollY) window.scrollTo(0, 0);
        }
        if (vv) {
          vv.addEventListener('resize', fit);
          vv.addEventListener('scroll', fit);
        }
        window.addEventListener('scroll', fit, { passive: true });
        window.addEventListener('orientationchange', fit);
        fit();
      })();
    </script>
  </head>

  <body>
    <!-- Use static rendering with Expo Router to support running without JavaScript. -->
    <noscript>
      You need to enable JavaScript to run this app.
    </noscript>
    <!-- The root element for your Expo app. -->
    <div id="root"></div>
  </body>
</html>
