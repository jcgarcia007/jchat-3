# location: 26.083048,-80.223725
# 05 — Gift (SENDER, Android account "test"): 2 items for the other person (iPhone "test1"), the card is
# HELD with the Stripe TEST card. Run 05-regalo-ios-acepta.yaml on the iPhone afterwards.
appId: com.juangarciacruz.jchatapp
env:
  VENUE: Bar XZX
  RECIPIENT: test1
  GIFT_ITEM_1: Mini Corn Dogs
---
- runFlow: ../helpers/open-app.yaml
- runFlow: ../helpers/login.yaml
- runFlow: ../helpers/enter-venue.yaml
# From the quick card of the other person in the chat (needs test1 inside the chat: the iPhone waits there).
- tapOn: "View ${RECIPIENT}.*options|Ver opciones de ${RECIPIENT}.*"
- extendedWaitUntil:
    visible:
      id: "quick-card-gift"
    timeout: 30000
- takeScreenshot: 01-tarjeta-rapida
- tapOn:
    id: "quick-card-gift"
- extendedWaitUntil:
    visible: "Gift for.*|Regalo para.*"
    timeout: 30000
# two units of the same item (the gift sheet only offers the venue's gift-eligible items)
- tapOn: "Add one ${GIFT_ITEM_1}|Añadir un ${GIFT_ITEM_1}"
- tapOn: "Add one ${GIFT_ITEM_1}|Añadir un ${GIFT_ITEM_1}"
- assertVisible: "Send gift · 2 items.*|Enviar regalo · 2 artículos.*"
- takeScreenshot: 02-hoja-regalo
- tapOn: "Send gift.*|Enviar regalo.*"
- runFlow: ../helpers/pay-test-card.yaml
- extendedWaitUntil:
    visible: "Gift on its way|Regalo en camino"
    timeout: 180000
- takeScreenshot: 03-regalo-enviado
- tapOn: "OK"
