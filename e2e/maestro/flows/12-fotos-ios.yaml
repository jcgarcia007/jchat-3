# location: 26.083048,-80.223725
# 12 — Photos (iOS simulator, account test1): (a) the gallery opens 3 times in a row (open → cancel) and a 4th time to pick;
# (b) the VERTICAL phone photo (EXIF orientation 6, tagged "QA-VERT-TOP", red bar on the right when upright) is published in
# a "[QA]" post and must look upright in the profile grid (portrait pixels, red bar on the right, not a sideways landscape).
# The dev client's floating gear (dev builds only) was dragged to the left edge (it covers the picker's confirm button at the
# right). Needs the sample photos in the simulator library:  xcrun simctl addmedia <udid> e2e/fixtures/*.jpg  (see README) and the
# Photos permission granted to the app.
appId: com.juangarciacruz.jchatapp
---
- runFlow: ../helpers/open-app.yaml
- runFlow: ../helpers/login.yaml
- tapOn: "Profile|Perfil"
- waitForAnimationToEnd:
    timeout: 3000
- tapOn:
    id: "profile-create-post-button"
- waitForAnimationToEnd:
    timeout: 2000
# (a) three open/cancel cycles
- repeat:
    times: 3
    commands:
      - tapOn:
          id: "create-post-gallery"
      - extendedWaitUntil:
          visible: "Select up to 4 photos.*|Selecciona hasta 4 fotos.*"
          timeout: 15000
      - tapOn: "Cancel|Cancelar"
      - waitForAnimationToEnd:
          timeout: 1500
# 4th time: pick the first photo of the first row's last column (the vertical sample, newest three first)
- tapOn:
    id: "create-post-gallery"
- extendedWaitUntil:
    visible: "Select up to 4 photos.*|Selecciona hasta 4 fotos.*"
    timeout: 15000
- takeScreenshot: 01-picker
- tapOn:
    point: "83%,27%"
- tapOn: "Done|Listo|Add|Añadir"
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: 02-compositor
- tapOn: "Escribe una descripci.*|Write a (caption|description).*"
- inputText: "[QA] foto vertical"
- tapOn: "Publish|Publicar|Post"
- waitForAnimationToEnd:
    timeout: 8000
- takeScreenshot: 03-perfil-cuadricula
