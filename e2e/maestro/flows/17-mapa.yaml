# location: 26.083048,-80.223725
# 17 — Map: the venue pin exposes its name (accessibility label), opens the preview card, and the filters respond.
appId: com.juangarciacruz.jchatapp
---
- runFlow: ../helpers/open-app.yaml
- runFlow: ../helpers/login.yaml
- tapOn: "Map|Mapa"
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: 01-mapa
# iOS simulator: the first position read can fail ("We couldn't get your location · tap to retry")
- runFlow:
    when:
      visible: ".*Toca para reintentar.*|.*tap to retry.*|.*Tap to retry.*"
    commands:
      - tapOn: ".*Toca para reintentar.*|.*tap to retry.*|.*Tap to retry.*"
      - waitForAnimationToEnd:
          timeout: 5000
# the pin exposes the venue name (iOS) / "Map Marker" (Android)
- extendedWaitUntil:
    visible: "Bar XZX|Map Marker"
    timeout: 20000
- tapOn: "Bar XZX|Map Marker"
- extendedWaitUntil:
    visible: "Enter the chat|Entrar al chat|View menu|Ver menú"
    timeout: 10000
- takeScreenshot: 02-tarjeta-pin
