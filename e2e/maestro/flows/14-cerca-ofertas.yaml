# location: 26.083048,-80.223725
# 14 — Nearby shows a distance on each card (the tab asks for location once if never answered) and Offers loads its first page
# without waiting for the GPS fix: the time from tapping the Offers entry to the first card/empty state is in the log
# (screenshots 02-ofertas-t0 / 03-ofertas-lista; compare file times).
appId: com.juangarciacruz.jchatapp
---
- runFlow: ../helpers/open-app.yaml
- runFlow: ../helpers/login.yaml
- tapOn: "Nearby|Cerca.*"
- runFlow:
    when:
      visible: "Allow While Using App|Permitir al usar la app|While using the app|Mientras la app está en uso"
    commands:
      - tapOn: "Allow While Using App|Permitir al usar la app|While using the app|Mientras la app está en uso"
- extendedWaitUntil:
    visible: "[0-9]+([.,][0-9])? ?(m|km)"
    timeout: 25000
- takeScreenshot: 01-cerca-distancias
