# location: 26.083048,-80.223725
# 06 — Gift REJECTED (SENDER): same as 05; on the iPhone run 06-regalo-ios-rechaza.yaml (taps "No, thanks").
appId: com.juangarciacruz.jchatapp
env:
  VENUE: Bar XZX
  RECIPIENT: test1
  GIFT_ITEM_1: Tacos al Pastor
  GIFT_ITEM_2: Pizza de Trufa
---
- runFlow: ../helpers/open-app.yaml
- runFlow: ../helpers/login.yaml
- runFlow: ../helpers/enter-venue.yaml
# Through the 1:1 chat: the gift button only shows when the SERVER says both people are at the venue
# (gift_available), so it also proves the recipient's presence. (Needs e2e/seed-presence.sh or the iPhone inside.)
- tapOn: "Messages|Mensajes"
- tapOn: "${RECIPIENT}"
- extendedWaitUntil:
    visible:
      id: "dm-gift-button"
    timeout: 30000
- takeScreenshot: 01-chat-privado
- tapOn:
    id: "dm-gift-button"
- extendedWaitUntil:
    visible: "Gift for.*|Regalo para.*"
    timeout: 30000
- tapOn: "Add one ${GIFT_ITEM_1}|Añadir un ${GIFT_ITEM_1}"
- tapOn: "Add one ${GIFT_ITEM_2}|Añadir un ${GIFT_ITEM_2}"
- assertVisible: "Send gift · 2 items.*|Enviar regalo · 2 artículos.*"
- takeScreenshot: 02-hoja-regalo
- tapOn: "Send gift.*|Enviar regalo.*"
- runFlow: ../helpers/pay-test-card.yaml
- extendedWaitUntil:
    visible: "Gift on its way|Regalo en camino"
    timeout: 180000
- takeScreenshot: 03-regalo-enviado
- tapOn: "OK"
