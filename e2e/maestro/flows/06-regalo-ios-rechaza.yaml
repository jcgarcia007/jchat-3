# location: 26.083048,-80.223725
# 06 (RECIPIENT, iPhone account "test1"): sees the gift card and taps "No, thanks".
appId: com.juangarciacruz.jchatapp
env:
  VENUE: Bar XZX
---
- runFlow: ../helpers/open-app.yaml
- runFlow: ../helpers/login.yaml
- runFlow: ../helpers/enter-venue.yaml
# Stay in the chat (real-time presence: the sender finds this account in the people row) while the sender works.
- extendedWaitUntil:
    visible: "THIS TEXT NEVER APPEARS"
    timeout: ${RECIPIENT_WAIT_MS}
    optional: true
# the chat has no tab bar: minimize it first (the venue session stays)
- tapOn: "Go back|Volver"
- tapOn: "Messages|Mensajes"
- tapOn: ".*test.*"
- extendedWaitUntil:
    visible: ".*sent you a gift.*|.*te envió un regalo.*"
    timeout: 120000
- takeScreenshot: 01-tarjeta-regalo
- tapOn:
    id: "gift-decline"
- extendedWaitUntil:
    visible: "Not accepted|No aceptado"
    timeout: 30000
- takeScreenshot: 02-rechazado
