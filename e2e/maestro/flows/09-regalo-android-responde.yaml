# location: 26.083048,-80.223725
# (ACTION / TABLE come from e2e/run.sh defaults: a header `env:` would beat the -e of the command line)
# 09 — Gift, RECIPIENT = Android account "test": waits for the gift card from "test1" in the 1:1 chat and answers.
#   ACTION=decline → taps "No, thanks"        ACTION=accept → "Accept" with table 12
appId: com.juangarciacruz.jchatapp
env:
  VENUE: Bar XZX
---
- runFlow: ../helpers/open-app.yaml
- runFlow: ../helpers/login.yaml
- runFlow: ../helpers/enter-venue.yaml
- tapOn: "Go back|Volver"
- tapOn: "Messages|Mensajes"
- tapOn:
    id: "dm-row-0b4895d0.*"
# The thread keeps older gift cards (also "X sent you a gift"): wait for the buttons of a card that is waiting.
- runFlow:
    when:
      true: ${ACTION == 'decline'}
    commands:
      - extendedWaitUntil:
          visible:
            id: "gift-decline"
          timeout: 300000
      - takeScreenshot: 01-card-received
      - tapOn:
          id: "gift-decline"
- runFlow:
    when:
      true: ${ACTION == 'accept'}
    commands:
      - extendedWaitUntil:
          visible:
            id: "gift-accept"
          timeout: 300000
      - takeScreenshot: 01-card-received
      - tapOn:
          id: "gift-accept"
      - extendedWaitUntil:
          visible: "Which table are you at\\?|¿Cuál es tu mesa\\?"
          timeout: 15000
      - tapOn: "Table number|Número de mesa"
      - inputText: ${TABLE}
      - tapOn: "Accept gift|Aceptar regalo"
- takeScreenshot: 02-responded
- extendedWaitUntil:
    visible: "Not accepted|No aceptado|Accepted.*|Aceptado.*"
    timeout: 30000
- takeScreenshot: 03-card-final
