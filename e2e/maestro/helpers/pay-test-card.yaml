# Stripe PaymentSheet (TEST mode): fills the published test card and pays. The "Pay" button is not
# exposed to the accessibility tree by the sheet, so it is tapped by position.
appId: com.juangarciacruz.jchatapp
env:
  CARD_NUMBER: "4242424242424242"
  CARD_EXPIRY: "1234"
  CARD_CVC: "123"
  CARD_ZIP: "12345"
---
- extendedWaitUntil:
    visible: "Card"
    timeout: 60000
- tapOn: "Card"
- tapOn: "Card number"
- inputText: ${CARD_NUMBER}
- inputText: ${CARD_EXPIRY}
- inputText: ${CARD_CVC}
- inputText: ${CARD_ZIP}
# The "Pay" button is not exposed to the accessibility tree: it is tapped by position.
#   iOS: the number pad stays open, the sheet is expanded and "Pay" sits at ~60% of the screen height.
#   Android: after the ZIP the keyboard closes (usually) and the whole form is on screen with "Pay" at ~90%; if the
#   "Save payment details" checkbox is hidden (keyboard still open) it is at ~58% as before.
- runFlow:
    when:
      platform: iOS
    commands:
      - tapOn:
          point: "50%,60%"
- evalScript: ${output.payTapped = false}
- runFlow:
    when:
      platform: Android
      visible: "Save payment details.*"
    commands:
      - tapOn:
          point: "50%,90%"
      - evalScript: ${output.payTapped = true}
- runFlow:
    when:
      platform: Android
      true: ${!output.payTapped}
    commands:
      - tapOn:
          point: "50%,58%"
