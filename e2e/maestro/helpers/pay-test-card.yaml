# Stripe PaymentSheet (TEST mode): fills the published test card and pays. The "Pay" button is not
# exposed to the accessibility tree by the sheet, so it is tapped by position.
appId: com.juangarciacruz.jchatapp
env:
  CARD_NUMBER: "4242424242424242"
  CARD_EXPIRY: "1234"
  CARD_CVC: "123"
  CARD_ZIP: "12345"
---
- extendedWaitUntil:
    visible: "Card"
    timeout: 60000
- tapOn: "Card"
- tapOn: "Card number"
- inputText: ${CARD_NUMBER}
- inputText: ${CARD_EXPIRY}
- inputText: ${CARD_CVC}
- inputText: ${CARD_ZIP}
# The "Pay" button is not exposed to the accessibility tree. Its position depends on the keyboard: with it still open
# (iOS number pad) the sheet is expanded and "Pay" sits at ~58%; with it closed (Android after the ZIP) the whole
# form, including the "Save payment details" checkbox, is on screen and "Pay" sits at ~90%.
- evalScript: ${output.payTapped = false}
- runFlow:
    when:
      visible: "Save payment details.*"
    commands:
      - tapOn:
          point: "50%,90%"
      - evalScript: ${output.payTapped = true}
- runFlow:
    when:
      true: ${!output.payTapped}
    commands:
      - tapOn:
          point: "50%,58%"
