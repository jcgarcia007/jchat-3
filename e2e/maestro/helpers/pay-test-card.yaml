# Stripe PaymentSheet (TEST mode): fills the published test card and pays. The "Pay" button is not
# exposed to the accessibility tree by the sheet, so it is tapped by position.
appId: com.juangarciacruz.jchatapp
env:
  CARD_NUMBER: "4242424242424242"
  CARD_EXPIRY: "1234"
  CARD_CVC: "123"
  CARD_ZIP: "12345"
---
- extendedWaitUntil:
    visible: "Card"
    timeout: 60000
- tapOn: "Card"
- tapOn: "Card number"
- inputText: ${CARD_NUMBER}
- inputText: ${CARD_EXPIRY}
- inputText: ${CARD_CVC}
- inputText: ${CARD_ZIP}
# Android exposes the "Pay $x" button text: tap it when it is on screen; otherwise (iOS, or the keyboard still open) the
# sheet is expanded and "Pay" sits at ~58% of the screen height.
- evalScript: ${output.payTapped = false}
- runFlow:
    when:
      visible: "Pay \\$[0-9].*"
    commands:
      - tapOn: "Pay \\$[0-9].*"
      - evalScript: ${output.payTapped = true}
- runFlow:
    when:
      true: ${!output.payTapped}
    commands:
      - tapOn:
          point: "50%,58%"
