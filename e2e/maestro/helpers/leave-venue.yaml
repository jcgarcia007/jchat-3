# Ends the venue session from the chat (⋯ → Leave the venue → confirm) so the next flow starts clean.
appId: com.juangarciacruz.jchatapp
---
- runFlow: dismiss-logbox.yaml
- runFlow:
    when:
      visible: "More options|Más opciones"
    commands:
      - tapOn: "More options|Más opciones"
      - tapOn:
          id: "venue-leave"
      # the native confirmation alert. Android: the confirm button is upper-case and a text match did not hit it (the title is
      # "Leave the venue?"), so it is tapped by position (bottom right of the dialog); iOS: by text.
      - runFlow:
          when:
            platform: Android
          commands:
            - tapOn:
                point: "73%,57%"
      - runFlow:
          when:
            platform: iOS
          commands:
            - tapOn: "Leave the venue|Salir del local"
- extendedWaitUntil:
    visible: "Nearby|Cerca.*"
    timeout: 20000
